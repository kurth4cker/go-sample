# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
permissions:
  contents: read

on:
  push:
    branches:
      - v0
  pull_request:
    branches:
      - v0

jobs:

  go1_23:
    runs-on: ubuntu-latest
    container:
      image: golang:1.23

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...


  go1_24:
    runs-on: ubuntu-latest
    container:
      image: golang:1.24

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...


  go-latest:
    runs-on: ubuntu-latest
    container:
      image: golang:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...


  build-matrix:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: [1.23, 1.24, latest]

    container:
      image: golang:${{ matrix.go-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
